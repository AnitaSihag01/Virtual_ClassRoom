<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay · Virtual Classroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c6cff'/%3E%3Ctext x='16' y='21' font-size='14' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'%3EVC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header id="topbar"></header>
<div class="replay">
  <section>
    <div class="stage"><canvas id="board"></canvas></div>
    <div class="controls">
      <button class="play-btn" id="play" title="Play / pause"></button>
      <span class="time" id="time">00:00 / 00:00</span>
      <input type="range" id="seek" min="0" max="1000" step="50" value="0">
      <select class="speed" id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select>
    </div>
  </section>
  <aside class="panel"><div class="panel-head"><span>Chat</span></div><div class="panel-body msgs" id="msgs"></div></aside>
</div>
<script src="/js/common.js"></script>
<script src="/js/replay.js"></script>
</body></html>
