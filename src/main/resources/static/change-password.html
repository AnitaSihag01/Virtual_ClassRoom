<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password · Virtual Classroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c6cff'/%3E%3Ctext x='16' y='21' font-size='14' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'%3EVC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="logo">VC</div>
    <h2>Set a new password</h2>
    <p class="muted" style="margin:6px 0 22px">You are using a temporary password. Choose a new one to continue.</p>
    <form class="form" id="form">
      <div id="err" class="error-box" hidden></div>
      <label class="field"><span>Temporary / current password</span><input type="password" id="old" required autocomplete="current-password"></label>
      <label class="field"><span>New password (min 6 characters)</span><input type="password" id="nw" required minlength="6" autocomplete="new-password"></label>
      <label class="field"><span>Confirm new password</span><input type="password" id="cf" required minlength="6" autocomplete="new-password"></label>
      <button class="btn primary block" id="go" type="submit">Save password</button>
      <button class="btn ghost block" type="button" id="out">Log out</button>
    </form>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
let user;
(async () => { user = await me(); if (!user.mustChangePassword) location.href = homeFor(user.role); })();
$('#out').onclick = logout;
$('#form').onsubmit = async e => {
  e.preventDefault();
  const err = $('#err'); err.hidden = true;
  if ($('#nw').value !== $('#cf').value) { err.textContent = 'The new passwords do not match.'; err.hidden = false; return; }
  $('#go').disabled = true;
  try {
    await api('/api/common/change-password', { method: 'POST', silent: true, body: { oldPassword: $('#old').value, newPassword: $('#nw').value } });
    toast('Password updated', 'success'); setTimeout(() => location.href = homeFor(user.role), 600);
  } catch (ex) { err.textContent = ex.message; err.hidden = false; $('#go').disabled = false; }
};
</script>
</body></html>
